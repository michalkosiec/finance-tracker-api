name: .NET Core Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/backend/FinanceTracker.sln

      - name: Build
        run: dotnet build src/backend/FinanceTracker.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/backend/FinanceTracker.Tests/FinanceTracker.Tests.csproj --no-build --verbosity normal
